<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Master MCQ Test - Mathematics 101</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* MCQ SPECIFIC STYLES */
        .progress-container { width: 100%; background: #e0e0e0; border-radius: 20px; overflow: hidden; margin: 20px 0; height: 15px; }
        .progress-bar { height: 100%; background: #4caf50; width: 0%; transition: width 0.4s ease; }
        
        .score-board { display: flex; justify-content: space-between; font-weight: bold; font-size: 1.2em; color: #555; margin-bottom: 20px; padding: 0 10px; }
        
        .mcq-question { font-size: 1.4em; font-weight: 800; color: #333; margin-bottom: 20px; }
        
        .mcq-options { display: flex; flex-direction: column; gap: 12px; }
        .mcq-option { background: white; border: 2px solid #ccc; border-radius: 12px; padding: 15px 20px; font-size: 1.1em; text-align: left; cursor: pointer; transition: 0.2s; font-family: inherit; color: #333; }
        .mcq-option:hover:not(:disabled) { border-color: #1976d2; background: #f5f9ff; transform: translateX(5px); }
        
        .mcq-option.correct { background: #e8f5e9; border-color: #4caf50; color: #1b5e20; font-weight: bold; }
        .mcq-option.wrong { background: #ffebee; border-color: #f44336; color: #b71c1c; }
        
        .explanation-box { display: none; background: #fff9c4; border-left: 6px solid #fbc02d; padding: 20px; border-radius: 10px; margin-top: 25px; font-size: 1.05em; color: #333; line-height: 1.5; animation: fadeIn 0.5s ease; }
        
        .next-btn-container { text-align: right; margin-top: 20px; display: none; }
        
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>
    <div class="top-nav">
        <a href="index.html" class="back-btn">🏠 Back to Course Home</a>
        <button class="nav-btn" onclick="resetProgress()" style="background: #f44336;">🔄 Reset Test Progress</button>
    </div>

    <h1>🏆 The Master Challenge</h1>
    <p class="subtitle">Test your mastery across all chapters!</p>

    <div class="section-box" id="test-container">
        <div class="score-board">
            <span id="question-counter">Question: 1 / 20</span>
            <span id="score-tracker">Score: 0</span>
        </div>
        
        <div class="progress-container">
            <div class="progress-bar" id="progress-bar"></div>
        </div>

        <div id="quiz-area">
            <div class="mcq-question" id="q-text">Loading question...</div>
            
            <div class="mcq-options" id="q-options"></div>

            <div class="explanation-box" id="q-explanation">
                <strong>Explanation:</strong> <span id="exp-text"></span>
            </div>

            <div class="next-btn-container" id="next-container">
                <button class="nav-btn" onclick="nextQuestion()">Next Question ➡️</button>
            </div>
        </div>

        <div id="end-screen" style="display: none; text-align: center; padding: 40px 0;">
            <h2 style="font-size: 2.5em; color: #4caf50;">🎉 Test Complete!</h2>
            <p style="font-size: 1.5em; color: #555;">Final Score: <strong id="final-score">0 / 20</strong></p>
            <p style="color: #666; margin-top: 20px;">You can review your concepts or reset the test to try a new randomised batch of questions.</p>
        </div>
    </div>
	<!-- 1. Load the question bank first -->
   <script src="questions.js"></script>
   <script>
    const TOTAL_QUESTIONS_LIMIT = 20; 
    let activeQuestions = [];
    let currentIndex = 0;
    let score = 0;
    let answeredCurrent = false;

    // 1. Incognito Mode Failsafe Wrappers
    function safeGet(key) {
        try { return JSON.parse(localStorage.getItem(key)); } 
        catch (e) { return null; }
    }
    
    function safeSet(key, value) {
        try { localStorage.setItem(key, JSON.stringify(value)); } 
        catch (e) { console.warn("Incognito Mode: Saving disabled."); }
    }
    
    function safeRemove(key) {
        try { localStorage.removeItem(key); } 
        catch (e) {}
    }

    // 2. Master Pacing & Randomization
    function shuffleArray(array) {
        let curId = array.length;
        while (0 !== curId) {
            let randId = Math.floor(Math.random() * curId);
            curId -= 1;
            let tmp = array[curId];
            array[curId] = array[randId];
            array[randId] = tmp;
        }
        return array;
    }

    function initTest() {
        const savedData = safeGet('math101_mcq');
        if (savedData && savedData.activeQuestions && savedData.activeQuestions.length > 0) {
            activeQuestions = savedData.activeQuestions;
            currentIndex = savedData.currentIndex;
            score = savedData.score;
        } else {
            let shuffled = shuffleArray([...masterQuestionBank]);
            activeQuestions = shuffled.slice(0, Math.min(TOTAL_QUESTIONS_LIMIT, shuffled.length));
            currentIndex = 0;
            score = 0;
            saveProgress();
        }

        if (currentIndex >= activeQuestions.length) {
            showEndScreen();
        } else {
            renderQuestion();
        }
    }

    function renderQuestion() {
        answeredCurrent = false;
        document.getElementById('next-container').style.display = "none";
        document.getElementById('q-explanation').style.display = "none";
        
        const qData = activeQuestions[currentIndex];
        const totalQ = activeQuestions.length;

        document.getElementById('question-counter').textContent = `Question: ${currentIndex + 1} / ${totalQ}`;
        document.getElementById('score-tracker').textContent = `Score: ${score}`;
        document.getElementById('progress-bar').style.width = `${(currentIndex / totalQ) * 100}%`;

        document.getElementById('q-text').textContent = qData.question;

        const optionsContainer = document.getElementById('q-options');
        optionsContainer.innerHTML = "";

        qData.options.forEach((optText, index) => {
            let btn = document.createElement('button');
            btn.className = "mcq-option";
            btn.textContent = optText;
            btn.onclick = () => selectOption(index, btn);
            optionsContainer.appendChild(btn);
        });
    }

    function selectOption(selectedIndex, clickedBtn) {
        if (answeredCurrent) return; 
        answeredCurrent = true;

        const qData = activeQuestions[currentIndex];
        const buttons = document.getElementById('q-options').children;

        for (let i = 0; i < buttons.length; i++) {
            buttons[i].disabled = true; 
            if (i === qData.correct) {
                buttons[i].classList.add('correct');
            }
        }

        if (selectedIndex === qData.correct) {
            score++;
        } else {
            clickedBtn.classList.add('wrong');
        }

        document.getElementById('exp-text').textContent = qData.explanation;
        document.getElementById('q-explanation').style.display = "block";
        document.getElementById('next-container').style.display = "block";

        saveProgress(currentIndex + 1, score);
        document.getElementById('score-tracker').textContent = `Score: ${score}`;
    }

    function nextQuestion() {
        currentIndex++;
        if (currentIndex >= activeQuestions.length) {
            document.getElementById('progress-bar').style.width = `100%`;
            showEndScreen();
        } else {
            renderQuestion();
        }
    }

    function showEndScreen() {
        document.getElementById('quiz-area').style.display = "none";
        const endScreen = document.getElementById('end-screen');
        endScreen.style.display = "block";
        document.getElementById('final-score').textContent = `${score} / ${activeQuestions.length}`;
        
        // 3. Platinum Trophy Logic
        if (score === activeQuestions.length) {
            try { localStorage.setItem('math101_trophy_platinum', 'earned'); } catch(e) {}
            endScreen.innerHTML += `
                <h1 style="font-size: 5em; margin: 15px 0;">💎</h1>
                <h2 style="color: #1976d2;">Platinum Trophy Unlocked!</h2>
                <p style="color: #666;">You have achieved true mathematical mastery.</p>
            `;
        }
        
        safeRemove('math101_mcq'); 
    }

    function saveProgress(nextIdx = currentIndex, currentScore = score) {
        const data = {
            activeQuestions: activeQuestions,
            currentIndex: nextIdx,
            score: currentScore
        };
        safeSet('math101_mcq', data);
    }

    function resetProgress() {
        if(confirm("Are you sure you want to reset your test? All progress will be lost!")) {
            safeRemove('math101_mcq');
            location.reload();
        }
    }

    window.onload = initTest;
</script>
</body>
</html>
