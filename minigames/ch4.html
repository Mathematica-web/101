<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chapter 4 Game: Equation Defender</title>
    <link rel="stylesheet" href="minigames.css">
    <style>
        :root { --theme-main: #5e35b1; --theme-light: #ede7f6; --theme-accent: #311b92; --correct: #4caf50; --wrong: #ff1744; }
        
        .radar-board { background: #000; padding: 15px; text-align: center; border-bottom: 3px solid var(--correct); z-index: 15; color: var(--correct); font-family: monospace; }
        .radar-board h3 { font-size: 1em; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 5px; opacity: 0.8; }
        .radar-board h1 { font-size: 2.5em; letter-spacing: 3px; text-shadow: 0 0 10px var(--correct); }
        
        .game-area { background: linear-gradient(135deg, #ede7f6 0%, #d1c4e9 100%); cursor: crosshair; }
        
        .meteor { position: absolute; padding: 15px; background: rgba(94, 53, 177, 0.9); border: 2px solid #fff; border-radius: 50%; font-weight: bold; font-size: 1.2em; color: #fff; box-shadow: 0 0 15px rgba(94, 53, 177, 0.5); transform: translateX(-50%); transition: background 0.1s, border-color 0.1s, box-shadow 0.1s, transform 0.1s; cursor: pointer; display: flex; justify-content: center; align-items: center; text-shadow: 0 2px 4px #000; }
        .meteor:active { transform: translateX(-50%) scale(0.9); }
    </style>
</head>
<body>

<div class="game-wrapper">
    <div class="header">
        <a href="../chapters/chapter4.html" class="back-btn">⬅ Exit</a>
        <div>Score: <span id="score-disp">0</span> / 15</div>
        <div>Lives: <span id="lives-disp">❤️❤️❤️</span></div>
    </div>

    <div class="radar-board">
        <h3>Defend Equation:</h3>
        <h1 id="target-eq">x + y = 10</h1>
    </div>

    <div class="game-area" id="game-area">
        <div class="screen" id="start-screen">
            <h2>Equation Defender</h2>
            <p>Tap meteors that are CORRECT solutions to the equation. Ignore the wrong ones! If a correct solution hits the ground, you lose a life.</p>
            <button class="start-btn" onclick="startGame()">▶ Play Now</button>
        </div>

        <div class="screen hidden" id="game-over-screen">
            <h2 id="end-title" style="color: var(--wrong);">Game Over!</h2>
            <p>Meteors Destroyed: <strong id="final-score">0</strong></p>
            <button class="start-btn" onclick="startGame()">🔄 Try Again</button>
        </div>

        <div class="screen victory-screen hidden" id="victory-screen">
            <h2>Level Cleared! 🏆</h2>
            <p>Next Chapter in <strong id="redirect-counter">3</strong>...</p>
        </div>
    </div>
</div>

<script>
    const equationBank = [
        { eq: "x + y = 10", test: (x,y) => x + y === 10, valids: [[5,5],[6,4],[4,6],[8,2],[2,8],[10,0],[7,3]] },
        { eq: "y - x = 2", test: (x,y) => y - x === 2, valids: [[1,3],[2,4],[3,5],[4,6],[5,7],[0,2],[6,8]] },
        { eq: "2x + y = 8", test: (x,y) => 2*x + y === 8, valids: [[1,6],[2,4],[3,2],[4,0],[0,8]] },
        { eq: "y = 2x", test: (x,y) => y === 2*x, valids: [[1,2],[2,4],[3,6],[4,8],[5,10],[0,0]] },
        { eq: "x - y = 5", test: (x,y) => x - y === 5, valids: [[10,5],[8,3],[7,2],[6,1],[5,0]] },
        { eq: "3x + y = 12", test: (x,y) => 3*x + y === 12, valids: [[1,9],[2,6],[3,3],[4,0]] },
        { eq: "x + 2y = 10", test: (x,y) => x + 2*y === 10, valids: [[0,5],[2,4],[4,3],[6,2],[8,1],[10,0]] },
        { eq: "y = x + 4", test: (x,y) => y === x + 4, valids: [[0,4],[1,5],[2,6],[3,7],[4,8],[5,9]] }
    ];

    let score = 0, lives = 3, gameInterval, spawnInterval, fallSpeed = 1.5, spawnRate = 1800, activeMeteors = [];
    let currentEq = null, availableEqs = [];
    const gameArea = document.getElementById('game-area');

    function startGame() {
        document.getElementById('start-screen').classList.add('hidden');
        document.getElementById('game-over-screen').classList.add('hidden');
        score = 0; lives = 3; fallSpeed = 1.5; spawnRate = 1800;
        availableEqs = [...equationBank].sort(() => Math.random() - 0.5);
        activeMeteors.forEach(m => m.element.remove()); activeMeteors = [];
        loadNextEquation();
        updateHUD();
        gameInterval = setInterval(updateGame, 20); spawnMeteor();
    }

    function loadNextEquation() {
        if (availableEqs.length === 0) availableEqs = [...equationBank].sort(() => Math.random() - 0.5);
        currentEq = availableEqs.pop();
        document.getElementById('target-eq').textContent = currentEq.eq;
    }

    function spawnMeteor() {
        const meteor = document.createElement('div');
        meteor.className = 'meteor';
        let x, y, isCorrect;
        
        if (Math.random() > 0.5) {
            const pair = currentEq.valids[Math.floor(Math.random() * currentEq.valids.length)];
            x = pair[0]; y = pair[1];
        } else {
            x = Math.floor(Math.random() * 11);
            y = Math.floor(Math.random() * 11);
        }
        
        isCorrect = currentEq.test(x, y);
        meteor.textContent = `(${x}, ${y})`;
        meteor.style.left = `${15 + Math.random() * 70}%`; 
        meteor.style.top = '-80px';
        
        const interact = (e) => { e.preventDefault(); blastMeteor(meteor, isCorrect); };
        meteor.onmousedown = interact;
        meteor.ontouchstart = interact;
        
        gameArea.appendChild(meteor);
        activeMeteors.push({ element: meteor, y: -80, isCorrect: isCorrect });
        spawnInterval = setTimeout(spawnMeteor, spawnRate);
    }

    function updateGame() {
        const bottomLimit = gameArea.offsetHeight;
        activeMeteors.forEach((meteorObj, index) => {
            meteorObj.y += fallSpeed; meteorObj.element.style.top = `${meteorObj.y}px`;
            if (meteorObj.y >= bottomLimit) {
                if (meteorObj.isCorrect) loseLife();
                meteorObj.element.remove();
                activeMeteors.splice(index, 1);
            }
        });
    }

    function blastMeteor(element, isCorrect) {
        if (element.style.pointerEvents === 'none') return;
        element.style.pointerEvents = 'none';

        const meteorIndex = activeMeteors.findIndex(m => m.element === element);
        if (meteorIndex > -1) activeMeteors.splice(meteorIndex, 1);

        if (isCorrect) {
            score++;
            element.style.background = 'var(--correct)'; element.style.borderColor = 'var(--correct)'; element.style.boxShadow = '0 0 20px var(--correct)';
            setTimeout(() => element.remove(), 150);
            
            if (score >= 15) return triggerVictory('../chapters/chapter5.html', 'math101_trophy_ch4');
            
            if (score % 4 === 0) {
                fallSpeed += 0.3; spawnRate = Math.max(900, spawnRate - 150);
                loadNextEquation(); 
            }
        } else {
            loseLife();
            element.style.background = 'var(--wrong)'; element.style.borderColor = 'var(--wrong)'; element.style.boxShadow = '0 0 20px var(--wrong)';
            setTimeout(() => element.remove(), 200);
        }
        updateHUD();
    }

    function loseLife() {
        lives--; updateHUD();
        gameArea.style.background = '#ffcdd2'; 
        setTimeout(() => gameArea.style.background = 'linear-gradient(135deg, #ede7f6 0%, #d1c4e9 100%)', 150);
        if (lives <= 0) endGame();
    }

    function updateHUD() {
        document.getElementById('score-disp').textContent = score;
        document.getElementById('lives-disp').textContent = '❤️'.repeat(lives);
    }

    function triggerVictory(nextUrl, trophyKey) {
        clearInterval(gameInterval); clearTimeout(spawnInterval);
        localStorage.setItem(trophyKey, 'earned');
        document.getElementById('victory-screen').classList.remove('hidden');
        let countdown = 3;
        const counterDisp = document.getElementById('redirect-counter');
        counterDisp.textContent = countdown;
        const countInterval = setInterval(() => {
            countdown--;
            if (countdown > 0) counterDisp.textContent = countdown;
            else { clearInterval(countInterval); window.location.href = nextUrl; }
        }, 1000);
    }

    function endGame() {
        clearInterval(gameInterval); clearTimeout(spawnInterval);
        document.getElementById('game-over-screen').classList.remove('hidden');
        document.getElementById('final-score').textContent = score;
    }
</script>
</body>
</html>
