<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chapter 6 Game: Laser Architect</title>
    <link rel="stylesheet" href="minigames.css">
    <style>
        :root { --theme-main: #0288d1; --theme-light: #e1f5fe; --theme-accent: #01579b; --correct: #4caf50; --wrong: #d32f2f; }
        .radar-board { background: #111; padding: 15px; text-align: center; border-bottom: 3px solid var(--theme-main); z-index: 15; color: white; }
        .radar-board h3 { font-size: 0.9em; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 5px; color: #aaa; }
        .radar-board h1 { font-size: 1.8em; letter-spacing: 1px; color: var(--theme-main); text-shadow: 0 0 10px var(--theme-main); }
        .game-area { background: linear-gradient(135deg, #e1f5fe 0%, #b3e5fc 100%); position: relative; display: flex; justify-content: center; }
        
        /* Falling Laser Beam */
        .laser-beam { position: absolute; width: 6px; height: 60px; background: white; box-shadow: 0 0 15px 5px var(--theme-main); top: -60px; border-radius: 5px; transition: opacity 0.1s; }
        
        /* Base Mirror/Shield at the bottom */
        .shield-base { position: absolute; bottom: 20px; width: 80px; height: 20px; background: #555; border-radius: 10px 10px 0 0; border: 2px solid #777; border-bottom: none; display: flex; justify-content: center; align-items: center; box-shadow: 0 -5px 15px rgba(0,0,0,0.5); z-index: 10; transition: background 0.2s, box-shadow 0.2s; }
        .shield-base::after { content: 'MIRROR'; font-size: 0.6em; color: white; font-weight: bold; letter-spacing: 1px; }

        /* 2x2 Button Grid for Mobile */
        .angle-controls { display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; height: 160px; background: #111; border-top: 3px solid var(--theme-main); z-index: 20; }
        .angle-btn { border: 1px solid #333; background: #222; font-size: 1.5em; font-weight: bold; color: white; cursor: pointer; transition: background 0.1s; }
        .angle-btn:active { background: var(--theme-main); }
    </style>
</head>
<body>

<div class="game-wrapper">
    <div class="header">
        <a href="../chapters/chapter6.html" class="back-btn">⬅ Exit</a>
        <div>Score: <span id="score-disp">0</span> / 10</div>
        <div>Lives: <span id="lives-disp">❤️❤️❤️</span></div>
    </div>

    <div class="radar-board">
        <h3 id="question-type">Calibrating...</h3>
        <h1 id="question-val">--</h1>
    </div>

    <div class="game-area" id="game-area">
        <div class="shield-base" id="shield"></div>

        <div class="screen" id="start-screen">
            <h2>Laser Architect</h2>
            <p>Set your mirror to the exact angle needed to deflect the laser! Calculate complementary, supplementary, and vertically opposite angles before impact.</p>
            <button class="start-btn" onclick="startGame()">▶ Play Now</button>
        </div>

        <div class="screen hidden" id="game-over-screen">
            <h2 id="end-title" style="color: var(--wrong);">Game Over!</h2>
            <p>Lasers Deflected: <strong id="final-score">0</strong></p>
            <button class="start-btn" onclick="startGame()">🔄 Try Again</button>
        </div>

        <div class="screen victory-screen hidden" id="victory-screen">
            <h2>Level Cleared! 🏆</h2>
            <p>Next Chapter in <strong id="redirect-counter">3</strong>...</p>
        </div>
    </div>

    <div class="angle-controls">
        <button class="angle-btn" id="btn-0" onmousedown="checkAnswer(0)" ontouchstart="checkAnswer(0)">--</button>
        <button class="angle-btn" id="btn-1" onmousedown="checkAnswer(1)" ontouchstart="checkAnswer(1)">--</button>
        <button class="angle-btn" id="btn-2" onmousedown="checkAnswer(2)" ontouchstart="checkAnswer(2)">--</button>
        <button class="angle-btn" id="btn-3" onmousedown="checkAnswer(3)" ontouchstart="checkAnswer(3)">--</button>
    </div>
</div>

<script>
    let score = 0, lives = 3, fallSpeed = 1, gameInterval;
    let correctAnswer = 0, currentLaser = null, laserY = -60;
    let roundActive = false;
    let currentOptions = [];
    let availableAngles = [];

    const gameArea = document.getElementById('game-area');
    const shield = document.getElementById('shield');
    const qTypeDisp = document.getElementById('question-type');
    const qValDisp = document.getElementById('question-val');

    function fillAngles() {
        availableAngles = [];
        const types = ["complementary", "supplementary", "vertical"];
        types.forEach(type => {
            let max = (type === "complementary") ? 8 : 17;
            for(let i=1; i<=max; i++) {
                availableAngles.push({ type: type, val: i*10 });
            }
        });
        availableAngles.sort(() => Math.random() - 0.5);
    }

    function startGame() {
        document.getElementById('start-screen').classList.add('hidden');
        document.getElementById('game-over-screen').classList.add('hidden');
        score = 0; lives = 3; fallSpeed = 1;
        fillAngles();
        updateHUD();
        nextRound();
    }

    function generateQuestion() {
        if (availableAngles.length === 0) fillAngles();
        const q = availableAngles.pop();
        const qType = q.type;
        const givenAngle = q.val;

        if (qType === "complementary") {
            correctAnswer = 90 - givenAngle;
            qTypeDisp.textContent = "Deflect with Complementary Angle to:";
        } else if (qType === "supplementary") {
            correctAnswer = 180 - givenAngle;
            qTypeDisp.textContent = "Deflect with Supplementary Angle to:";
        } else {
            correctAnswer = givenAngle;
            qTypeDisp.textContent = "Deflect with Vertically Opposite Angle to:";
        }
        
        qValDisp.textContent = `${givenAngle}°`;

        currentOptions = [correctAnswer];
        while (currentOptions.length < 4) {
            let decoy = correctAnswer + (Math.floor(Math.random() * 6) - 3) * 10;
            if (decoy <= 0) decoy += 180;
            if (decoy >= 180) decoy -= 90;
            if (!currentOptions.includes(decoy)) currentOptions.push(decoy);
        }
        
        currentOptions.sort(() => Math.random() - 0.5);
        for (let i = 0; i < 4; i++) {
            document.getElementById(`btn-${i}`).textContent = `${currentOptions[i]}°`;
        }
    }

    function nextRound() {
        if (currentLaser) currentLaser.remove();
        generateQuestion();
        
        currentLaser = document.createElement('div');
        currentLaser.className = 'laser-beam';
        laserY = -60;
        currentLaser.style.top = `${laserY}px`;
        gameArea.appendChild(currentLaser);
        
        roundActive = true;
        clearInterval(gameInterval);
        gameInterval = setInterval(updateLaser, 20);
    }

    function updateLaser() {
        const bottomLimit = gameArea.offsetHeight - 40; 
        laserY += fallSpeed;
        currentLaser.style.top = `${laserY}px`;
        
        if (laserY >= bottomLimit) loseLife();
    }

    function checkAnswer(btnIndex) {
        if (!roundActive) return;
        roundActive = false;
        clearInterval(gameInterval);
        
        if (currentOptions[btnIndex] === correctAnswer) {
            score++;
            shield.style.background = 'var(--correct)';
            shield.style.boxShadow = '0 -10px 30px var(--correct)';
            currentLaser.style.opacity = '0';
            
            setTimeout(() => {
                shield.style.background = '#555';
                shield.style.boxShadow = '0 -5px 15px rgba(0,0,0,0.5)';
                if (score >= 10) triggerVictory('../chapters/chapter7.html', 'math101_trophy_ch6');
                else {
                    if (score % 3 === 0) fallSpeed += 0.5;
                    nextRound();
                }
            }, 300);
        } else {
            loseLife();
        }
        updateHUD();
    }

    function loseLife() {
        roundActive = false;
        clearInterval(gameInterval);
        lives--;
        shield.style.background = 'var(--wrong)';
        currentLaser.style.background = 'var(--wrong)';
        currentLaser.style.boxShadow = '0 0 15px 5px var(--wrong)';
        gameArea.style.background = '#4a0000';
        
        setTimeout(() => {
            shield.style.background = '#555';
            gameArea.style.background = 'linear-gradient(135deg, #e1f5fe 0%, #b3e5fc 100%)';
            updateHUD();
            if (lives <= 0) endGame();
            else nextRound();
        }, 400);
    }

    function updateHUD() {
        document.getElementById('score-disp').textContent = score;
        document.getElementById('lives-disp').textContent = '❤️'.repeat(lives);
    }

    function triggerVictory(nextUrl, trophyKey) {
        localStorage.setItem(trophyKey, 'earned');
        document.getElementById('victory-screen').classList.remove('hidden');
        let countdown = 3;
        const counterDisp = document.getElementById('redirect-counter');
        counterDisp.textContent = countdown;
        const countInterval = setInterval(() => {
            countdown--;
            if (countdown > 0) counterDisp.textContent = countdown;
            else { clearInterval(countInterval); window.location.href = nextUrl; }
        }, 1000);
    }

    function endGame() {
        document.getElementById('game-over-screen').classList.remove('hidden');
        document.getElementById('final-score').textContent = score;
    }
</script>
</body>
</html>
